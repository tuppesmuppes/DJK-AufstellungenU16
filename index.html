<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>DJK U16 OL Rotationen</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#fff;
      --line: rgba(0,0,0,.14);
      --shadow: 0 12px 24px rgba(0,0,0,.08);
      --shadow2: 0 10px 18px rgba(0,0,0,.08);
      --radius: 18px;
      --team:#d11;
    }
    *{ box-sizing: border-box; }
    body{ margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color:#111; }
    .wrap{ max-width: 1200px; margin: 0 auto; padding: 12px; display:grid; gap: 14px; grid-template-columns: 1.2fr .8fr; align-items:start; }
    @media (max-width: 980px){ .wrap{ grid-template-columns: 1fr; } }
    .card{ background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; }
    .header{ display:flex; align-items:center; justify-content:space-between; gap: 10px; margin-bottom: 10px; }
    .title{ font-weight: 900; font-size: 18px; }
    .subtitle{ opacity:.7; font-size: 12px; margin-top:2px; }
    .row{ display:flex; gap: 8px; align-items:center; flex-wrap: wrap; }
    .btn{ appearance:none; border: 1px solid var(--line); background:#fff; padding: 10px 12px; border-radius: 14px; font-weight: 800; cursor:pointer; box-shadow: 0 6px 12px rgba(0,0,0,.08); }
    .btn:active{ transform: translateY(1px); }
    label.toggle{ display:flex; align-items:center; gap:8px; font-weight: 800; font-size: 13px; }

    #court{
      position: relative; width: 100%; height: min(78vh, 860px);
      border-radius: var(--radius); border: 2px solid rgba(0,0,0,.15);
      overflow:hidden; background: linear-gradient(180deg, rgba(240,248,255,1) 0%, rgba(245,245,245,1) 100%);
      touch-action: none; user-select:none;
    }
    @media (max-width: 980px){ #court{ height: 64vh; } }
    .inset-outline{ position:absolute; inset: 12px; border: 2px solid rgba(0,0,0,.18); border-radius: 14px; pointer-events:none; }
    .net{ position:absolute; left:0; right:0; top:0; height: 6px; background: rgba(0,0,0,.22); pointer-events:none; }

    .zones{ position:absolute; inset:0; pointer-events:none; }
    .zones .v1, .zones .v2{ position:absolute; top:0; bottom:0; width:2px; background: rgba(0,0,0,.08); }
    .zones .v1{ left:33.333%; } .zones .v2{ left:66.666%; }
    .zones .hmid{ position:absolute; left:0; right:0; top:50%; height:2px; background: rgba(0,0,0,.08); }
    .zone-num{ position:absolute; display:flex; align-items:center; justify-content:center; font-weight: 900; color: rgba(0,0,0,.12); font-size: 22px; }
    @media (max-width: 980px){ .zone-num{ font-size: 18px; } }

    /* BIGGER player badge */
    .player{
      position:absolute; transform: translate(-50%, -50%);
      width: 84px; height:84px; border-radius: 999px; background:#fff;
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
      border: 4px solid var(--team);
      touch-action:none; cursor: grab;
      padding: 6px;
    }
    @media (max-width: 980px){
      .player{ width:72px; height:72px; border-width: 4px; }
    }
    .player.dragging{ cursor: grabbing; box-shadow: 0 16px 30px rgba(0,0,0,.25); }
    .player .inner{ width:100%; text-align:center; line-height:1.05; }
    .player .topLine{ font-weight: 950; font-size: 18px; }
    .player .bottomLine{ font-weight: 800; font-size: 12px; opacity: .85; margin-top: 4px; }
    @media (max-width: 980px){
      .player .topLine{ font-size: 16px; }
      .player .bottomLine{ font-size: 11px; }
    }

    .panel{ display:grid; gap: 14px; }
    .team-card{ background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow2); padding: 12px; }
    .team-head{ display:flex; align-items:center; gap:10px; margin-bottom: 10px; }
    .dot{ width:12px; height:12px; border-radius: 999px; background: var(--team); }
    .tname{ flex:1; font-size: 14px; font-weight: 800; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); outline:none; }
    .grid{ display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    @media (min-width: 980px){ .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .pedit{ border: 1px solid rgba(0,0,0,.10); border-radius: 14px; padding: 8px; }
    .pedit .top{ display:flex; align-items:center; gap:8px; }
    .miniBadge{
      min-width: 44px; height:28px; border-radius: 999px;
      display:flex; align-items:center; justify-content:center;
      font-weight: 900; border: 2px solid var(--team);
      padding: 0 10px;
      text-align:center;
    }
    .meta{ flex:1; }
    .meta .p1{ font-weight: 900; font-size: 12px; }
    .meta .p2{ opacity:.7; font-size: 11px; }
    .inputs{ display:flex; gap: 6px; margin-top: 8px; }
    .small{ width: 100%; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); outline:none; font-size: 13px; background:#fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <div>
          <div class="title">Volleyball Positions Board (1 Team)</div>
          <div class="subtitle">Drag & Drop (Touch) · Rotation +1 · Speichern (localStorage)</div>
        </div>
        <div class="row">
          <label class="toggle"><input id="toggleZones" type="checkbox" />Zonen</label>
          <button class="btn" id="resetAll" title="Setzt alles zurück (überschreibt localStorage)">Reset</button>
        </div>
      </div>

      <div id="court">
        <div class="inset-outline"></div>
        <div class="net" title="Netz"></div>
        <div id="half"></div>
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="btn" id="rot">Rotation +1</button>
        <button class="btn" id="spots">Auf Spots</button>
      </div>
    </div>

    <div class="panel">
      <div class="team-card" id="teamCard"></div>
    </div>
  </div>

<script>
(() => {
  const LS_KEY = "vb_board_state_v4_single_team_red_letter_and_name_dropdown";

  const ROTATION_SPOTS = {
    4: { x: 20, y: 22 },
    3: { x: 50, y: 18 },
    2: { x: 80, y: 22 },
    5: { x: 20, y: 70 },
    6: { x: 50, y: 78 },
    1: { x: 80, y: 70 },
  };
  const ROTATE_PLUS_1 = { 1: 6, 6: 5, 5: 4, 4: 3, 3: 2, 2: 1 };

  // Dropdown 1: Buchstaben
  const LETTERS = ["", "Z", "A", "M", "D", "L"];

  // Dropdown 2: Namen
  const NAMES = ["", "Malou", "Anna", "Greta", "Zeynep", "Jule", "Alessa", "Ella", "Alma", "Johanna", "Milva", "Frida"];

  // Mindestabstände (in %)
  const MARGIN_X = 4;
  const MARGIN_Y = 4;

  const courtEl = document.getElementById("court");
  const halfEl  = document.getElementById("half");
  const teamCard = document.getElementById("teamCard");
  const toggleZones = document.getElementById("toggleZones");

  const btnRot = document.getElementById("rot");
  const btnSpots = document.getElementById("spots");
  const btnResetAll = document.getElementById("resetAll");

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const pxToPct = (px, sizePx) => sizePx === 0 ? 0 : (px / sizePx) * 100;
  const pctToPx = (pct, sizePx) => (pct / 100) * sizePx;

  function spotFor(pos){ return ROTATION_SPOTS[pos] || { x: 50, y: 50 }; }

  function defaultState(){
    return {
      version: 4,
      showZones: true,
      team: {
        name: "Team",
        players: [1,2,3,4,5,6].map(n => {
          const sp = spotFor(n);
          return { id: `P${n}`, letter: "", name: "", pos: n, x: sp.x, y: sp.y };
        }),
      },
    };
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(!raw) return null;
      const s = JSON.parse(raw);
      if(!s || s.version !== 4) return null;
      if (s.team?.players) s.team.players.forEach(p => {
        if (p.letter === undefined) p.letter = "";
        if (p.name === undefined) p.name = "";
      });
      return s;
    }catch{ return null; }
  }

  let state = loadState() || defaultState();

  function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch{} }

  // Badge: 1) Buchstabe+Positionsnummer, 2) Name
  function badgeTop(p){ return p.letter ? `${p.letter}${p.pos}` : `${p.pos}`; }
  function badgeBottom(p){ return p.name || ""; }

  // Constraints wie zuvor (auf Basis pos)
  function applyConstraintsForDragged(posNumber, x, y, playersByPos){
    const p1 = playersByPos[1], p2 = playersByPos[2], p3 = playersByPos[3],
          p4 = playersByPos[4], p5 = playersByPos[5], p6 = playersByPos[6];

    let minX = 0, maxX = 100, minY = 0, maxY = 100;

    if (posNumber === 3){
      maxY = Math.min(maxY, (p6.y - MARGIN_Y));
      minX = Math.max(minX, (p4.x + MARGIN_X));
      maxX = Math.min(maxX, (p2.x - MARGIN_X));
    }
    if (posNumber === 6){
      minY = Math.max(minY, (p3.y + MARGIN_Y));
      minX = Math.max(minX, (p5.x + MARGIN_X));
      maxX = Math.min(maxX, (p1.x - MARGIN_X));
    }
    if (posNumber === 5){
      minY = Math.max(minY, (p4.y + MARGIN_Y));
      maxX = Math.min(maxX, (p6.x - MARGIN_X));
    }
    if (posNumber === 1){
      minY = Math.max(minY, (p2.y + MARGIN_Y));
      minX = Math.max(minX, (p6.x + MARGIN_X));
    }
    if (posNumber === 2){
      minX = Math.max(minX, (p3.x + MARGIN_X));
      maxY = Math.min(maxY, (p1.y - MARGIN_Y));
    }
    if (posNumber === 4){
      maxX = Math.min(maxX, (p3.x - MARGIN_X));
      maxY = Math.min(maxY, (p5.y - MARGIN_Y));
    }

    if (minX > maxX) { const mid = (minX + maxX) / 2; minX = mid; maxX = mid; }
    if (minY > maxY) { const mid = (minY + maxY) / 2; minY = mid; maxY = mid; }

    return { x: clamp(x, minX, maxX), y: clamp(y, minY, maxY) };
  }

  function renderZones(){
    halfEl.querySelectorAll(".zones").forEach(n => n.remove());
    if(!state.showZones) return;

    const zonesEl = document.createElement("div");
    zonesEl.className = "zones";
    zonesEl.innerHTML = `<div class="v1"></div><div class="v2"></div><div class="hmid"></div>`;

    const zones = [
      { n: 4, col: 0, row: 0 }, { n: 3, col: 1, row: 0 }, { n: 2, col: 2, row: 0 },
      { n: 5, col: 0, row: 1 }, { n: 6, col: 1, row: 1 }, { n: 1, col: 2, row: 1 },
    ];

    zones.forEach(z => {
      const d = document.createElement("div");
      d.className = "zone-num";
      d.textContent = z.n;
      d.style.left = `${(z.col * 100) / 3}%`;
      d.style.top = `${(z.row * 100) / 2}%`;
      d.style.width = `${100/3}%`;
      d.style.height = `${100/2}%`;
      zonesEl.appendChild(d);
    });

    halfEl.appendChild(zonesEl);
  }

  function clearPlayers(){ halfEl.querySelectorAll(".player").forEach(n => n.remove()); }
  function getRect(){ const r = courtEl.getBoundingClientRect(); return { width: r.width, height: r.height }; }

  function renderPlayers(){
    clearPlayers();
    renderZones();
    const rect = getRect();

    state.team.players.forEach(p => {
      const el = document.createElement("div");
      el.className = "player";
      el.dataset.playerId = p.id;
      el.title = `${badgeTop(p)}${p.name ? " – " + p.name : ""}`;
      el.innerHTML = `
        <div class="inner">
          <div class="topLine">${escapeHtml(badgeTop(p))}</div>
          <div class="bottomLine">${escapeHtml(badgeBottom(p))}</div>
        </div>`;
      el.style.left = `${pctToPx(p.x, rect.width)}px`;
      el.style.top  = `${pctToPx(p.y, rect.height)}px`;
      halfEl.appendChild(el);
    });
  }

  function renderTeamCard(){
    const t = state.team;
    teamCard.innerHTML = "";

    const head = document.createElement("div");
    head.className = "team-head";
    head.innerHTML = `<div class="dot"></div><input class="tname" value="${escapeAttr(t.name)}" aria-label="Teamname" />`;
    head.querySelector("input").addEventListener("input", (e) => { state.team.name = e.target.value; saveState(); });

    const grid = document.createElement("div");
    grid.className = "grid";

    t.players.slice().sort((a,b) => a.pos - b.pos).forEach(p => {
      const box = document.createElement("div");
      box.className = "pedit";
      box.innerHTML = `
        <div class="top">
          <div class="miniBadge">${escapeHtml(badgeTop(p))}</div>
          <div class="meta">
            <div class="p1">Pos ${p.pos}</div>
            <div class="p2">${escapeHtml(p.name || "—")}</div>
          </div>
        </div>
        <div class="inputs">
          <select class="small letter" aria-label="Buchstabe">
            ${LETTERS.map(v => `<option value="${escapeAttr(v)}" ${p.letter===v ? "selected" : ""}>${escapeHtml(v || "—")}</option>`).join("")}
          </select>
          <select class="small name" aria-label="Name">
            ${NAMES.map(n => `<option value="${escapeAttr(n)}" ${p.name===n ? "selected" : ""}>${escapeHtml(n || "—")}</option>`).join("")}
          </select>
        </div>
      `;

      const selLetter = box.querySelector(".letter");
      const selName = box.querySelector(".name");

      function updateEverywhere(){
        box.querySelector(".miniBadge").textContent = badgeTop(p);
        box.querySelector(".p2").textContent = p.name || "—";
        const chip = document.querySelector(`.player[data-player-id="${cssEscape(p.id)}"]`);
        if (chip){
          chip.querySelector(".topLine").textContent = badgeTop(p);
          chip.querySelector(".bottomLine").textContent = badgeBottom(p);
          chip.title = `${badgeTop(p)}${p.name ? " – " + p.name : ""}`;
        }
      }

      selLetter.addEventListener("change", () => {
        p.letter = String(selLetter.value || "");
        saveState();
        updateEverywhere();
      });

      selName.addEventListener("change", () => {
        p.name = String(selName.value || "");
        saveState();
        updateEverywhere();
      });

      grid.appendChild(box);
    });

    teamCard.appendChild(head);
    teamCard.appendChild(grid);
  }

  function rotate(){
    state.team.players = state.team.players.map(p => {
      const newPos = ROTATE_PLUS_1[p.pos] ?? p.pos;
      const sp = spotFor(newPos);
      return { ...p, pos: newPos, x: sp.x, y: sp.y };
    });
    saveState();
    renderAll();
  }

  function resetSpots(){
    state.team.players = state.team.players.map(p => {
      const sp = spotFor(p.pos);
      return { ...p, x: sp.x, y: sp.y };
    });
    saveState();
    renderAll();
  }

  function hardReset(){
    state = defaultState();
    saveState();
    renderAll();
  }

  let drag = null;

  function findPlayer(playerId){ return state.team.players.find(p => p.id === playerId); }
  function playersByPos(){ const map = {}; for (const p of state.team.players) map[p.pos] = p; return map; }

  function onPointerDown(e){
    const target = e.target.closest(".player");
    if(!target) return;

    e.preventDefault();
    const playerId = target.dataset.playerId;
    const player = findPlayer(playerId);
    if(!player) return;

    const rect = courtEl.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    const size = getRect();
    const playerXpx = pctToPx(player.x, size.width);
    const playerYpx = pctToPx(player.y, size.height);

    drag = { playerId, pointerId: e.pointerId, offsetX: playerXpx - px, offsetY: playerYpx - py };

    target.classList.add("dragging");
    target.setPointerCapture(e.pointerId);
  }

  function onPointerMove(e){
    if(!drag) return;
    if(e.pointerId !== drag.pointerId) return;

    const player = findPlayer(drag.playerId);
    if(!player) return;

    const rect = courtEl.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    const size = getRect();
    const x = px + drag.offsetX;
    const y = py + drag.offsetY;

    const compact = window.innerWidth < 980;
    const pad = compact ? 30 : 34; // größerer Badge => mehr Padding

    const xClamped = clamp(x, pad, size.width - pad);
    const yClamped = clamp(y, pad, size.height - pad);

    let xPct = clamp(pxToPct(xClamped, size.width), 0, 100);
    let yPct = clamp(pxToPct(yClamped, size.height), 0, 100);

    const map = playersByPos();
    const adjusted = applyConstraintsForDragged(player.pos, xPct, yPct, map);
    player.x = adjusted.x;
    player.y = adjusted.y;

    const chip = document.querySelector(`.player[data-player-id="${cssEscape(player.id)}"]`);
    if(chip){
      chip.style.left = `${pctToPx(player.x, size.width)}px`;
      chip.style.top  = `${pctToPx(player.y, size.height)}px`;
    }

    saveState();
  }

  function onPointerUp(e){
    if(!drag) return;
    if(e.pointerId !== drag.pointerId) return;

    const chip = document.querySelector(`.player[data-player-id="${cssEscape(drag.playerId)}"]`);
    if(chip) chip.classList.remove("dragging");
    drag = null;
  }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll("\"","&quot;")
      .replaceAll("'","&#039;");
  }
  function escapeAttr(s){ return escapeHtml(s); }
  function cssEscape(s){ return String(s).replaceAll("\\", "\\\\").replaceAll("\"","\\\""); }

  function renderAll(){
    toggleZones.checked = !!state.showZones;
    renderPlayers();
    renderTeamCard();
  }

  toggleZones.addEventListener("change", () => { state.showZones = toggleZones.checked; saveState(); renderAll(); });

  btnRot.addEventListener("click", rotate);
  btnSpots.addEventListener("click", resetSpots);
  btnResetAll.addEventListener("click", hardReset);

  courtEl.addEventListener("pointerdown", onPointerDown);
  courtEl.addEventListener("pointermove", onPointerMove);
  courtEl.addEventListener("pointerup", onPointerUp);
  courtEl.addEventListener("pointercancel", onPointerUp);

  window.addEventListener("resize", () => {
    const size = getRect();
    state.team.players.forEach(p => {
      const chip = document.querySelector(`.player[data-player-id="${cssEscape(p.id)}"]`);
      if(chip){
        chip.style.left = `${pctToPx(p.x, size.width)}px`;
        chip.style.top  = `${pctToPx(p.y, size.height)}px`;
      }
    });
  });

  renderAll();
})();
</script>
</body>
</html>
